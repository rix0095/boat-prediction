<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BOAT RACE AI予想</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
        "Yu Gothic", sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 24px;
    }

    h2 {
      margin: 24px 0 10px;
      font-size: 19px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    input,
    select,
    button {
      width: 100%;
      min-height: 42px;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 16px;
      background: #fff;
    }

    button {
      margin-top: 12px;
      border: 0;
      background: #1677ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }

    .status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      background: #eef2f5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .error {
      background: #ffe7e7;
      color: #b00020;
    }

    .success {
      background: #e7f7eb;
      color: #176b2c;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
      background: #fff;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
      white-space: nowrap;
    }

    th {
      background: #eef1f4;
    }

    td input {
      width: 90px;
      min-height: 36px;
      padding: 4px 6px;
      text-align: right;
    }

    .odds {
      font-weight: bold;
    }

    .positive {
      color: #087f23;
      font-weight: bold;
    }

    .negative {
      color: #c00000;
      font-weight: bold;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .summary-box {
      background: #f1f4f7;
      padding: 12px;
      border-radius: 8px;
    }

    .summary-label {
      font-size: 12px;
      color: #666;
    }

    .summary-value {
      font-size: 20px;
      font-weight: bold;
      margin-top: 4px;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .grid {
        grid-template-columns: 1fr 1fr;
      }

      .summary {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>

  <h1>🚤 BOAT RACE AI予想</h1>

  <div class="card">

    <div class="grid">

      <div>
        <label for="date">開催日</label>
        <input type="date" id="date">
      </div>

      <div>
        <label for="venue">開催場</label>
        <select id="venue">
          <option value="">選択</option>
          <option>桐生</option>
          <option>戸田</option>
          <option>江戸川</option>
          <option>平和島</option>
          <option>多摩川</option>
          <option>浜名湖</option>
          <option>蒲郡</option>
          <option>常滑</option>
          <option>津</option>
          <option>三国</option>
          <option>びわこ</option>
          <option>住之江</option>
          <option>尼崎</option>
          <option>鳴門</option>
          <option>丸亀</option>
          <option>児島</option>
          <option>宮島</option>
          <option>徳山</option>
          <option>下関</option>
          <option>若松</option>
          <option>芦屋</option>
          <option>福岡</option>
          <option>唐津</option>
          <option>大村</option>
        </select>
      </div>

      <div>
        <label for="race">R</label>
        <select id="race">
          <option value="">選択</option>
          <option value="1">1R</option>
          <option value="2">2R</option>
          <option value="3">3R</option>
          <option value="4">4R</option>
          <option value="5">5R</option>
          <option value="6">6R</option>
          <option value="7">7R</option>
          <option value="8">8R</option>
          <option value="9">9R</option>
          <option value="10">10R</option>
          <option value="11">11R</option>
          <option value="12">12R</option>
        </select>
      </div>

      <div>
        <label for="minProbability">最低確率（%）</label>
        <input
          type="number"
          id="minProbability"
          value="0"
          min="0"
          max="100"
          step="0.1"
        >
      </div>

    </div>

    <button id="fetchButton">
      データ取得・予想開始
    </button>

    <div id="status" class="status">
      開催日・開催場・Rを選択してください。
    </div>

  </div>


  <div class="card">

    <h2>レース情報</h2>

    <div id="raceInfo">
      -
    </div>

  </div>


  <div class="card">

    <h2>6艇データ</h2>

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>艇</th>
            <th>選手</th>
            <th>級別</th>
            <th>全国勝率</th>
            <th>当地勝率</th>
            <th>平均ST</th>
            <th>モーター</th>
            <th>2連率</th>
            <th>ボート</th>
            <th>2連率</th>
            <th>展示</th>
            <th>チルト</th>
            <th>展示ST</th>
          </tr>
        </thead>

        <tbody id="boats">
        </tbody>

      </table>

    </div>

  </div>


  <div class="card">

    <h2>3連単予想</h2>

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>順位</th>
            <th>買い目</th>
            <th>的中確率</th>
            <th>オッズ</th>
            <th>期待払戻</th>
            <th>期待収支</th>
            <th>期待回収率</th>
          </tr>
        </thead>

        <tbody id="trifecta">
        </tbody>

      </table>

    </div>

  </div>


  <div class="card">

    <h2>レース全体</h2>

    <div class="summary">

      <div class="summary-box">
        <div class="summary-label">天候</div>
        <div class="summary-value" id="weather">-</div>
      </div>

      <div class="summary-box">
        <div class="summary-label">気温</div>
        <div class="summary-value" id="temperature">-</div>
      </div>

      <div class="summary-box">
        <div class="summary-label">水温</div>
        <div class="summary-value" id="waterTemperature">-</div>
      </div>

      <div class="summary-box">
        <div class="summary-label">風向</div>
        <div class="summary-value" id="windDirection">-</div>
      </div>

      <div class="summary-box">
        <div class="summary-label">風速</div>
        <div class="summary-value" id="windSpeed">-</div>
      </div>

      <div class="summary-box">
        <div class="summary-label">波高</div>
        <div class="summary-value" id="wave">-</div>
      </div>

    </div>

  </div>


<script>

/* =========================================
   共通
========================================= */

const $ = id => document.getElementById(id);

function num(id, fallback = 0) {
  const value = Number($(id)?.value);
  return Number.isFinite(value) ? value : fallback;
}


/* =========================================
   グローバル
========================================= */

let fetchedOdds = {};

let currentRace = null;

let currentPredictions = [];


/* =========================================
   初期日付
========================================= */

$("date").value =
  new Date().toISOString().slice(0, 10);


/* =========================================
   3連単120通り生成
========================================= */

function createAllTrifecta() {

  const result = [];

  for (let a = 1; a <= 6; a++) {

    for (let b = 1; b <= 6; b++) {

      for (let c = 1; c <= 6; c++) {

        if (
          a === b ||
          a === c ||
          b === c
        ) {
          continue;
        }

        result.push({
          combo: [a, b, c],
          probability: 0
        });

      }

    }

  }

  return result;

}


/* =========================================
   予想確率生成
========================================= */

function calculatePredictions(boats) {

  const scores = boats.map(boat => {

    const win =
      Number(boat.nationalWinRate) || 0;

    const local =
      Number(boat.localWinRate) || 0;

    const motor =
      Number(boat.motor2Rate) || 0;

    const boatRate =
      Number(boat.boat2Rate) || 0;

    const st =
      Number(boat.averageST) || 0.2;

    const exhibition =
      Number(boat.exhibitionTime) || 0;

    let score = 0;

    score += win * 10;
    score += local * 8;
    score += motor * 0.5;
    score += boatRate * 0.2;

    if (st > 0) {
      score += Math.max(0, 0.25 - st) * 100;
    }

    if (exhibition > 0) {
      score += Math.max(0, 7 - exhibition) * 10;
    }

    return Math.max(score, 0.01);

  });


  const total =
    scores.reduce(
      (sum, value) => sum + value,
      0
    );


  const winProb =
    scores.map(
      value => value / total
    );


  const predictions =
    createAllTrifecta();


  for (const item of predictions) {

    const a = item.combo[0] - 1;
    const b = item.combo[1] - 1;
    const c = item.combo[2] - 1;

    let probability =
      winProb[a] *
      (winProb[b] / Math.max(1 - winProb[a], 0.001)) *
      (winProb[c] / Math.max(
        1 - winProb[a] - winProb[b],
        0.001
      ));

    if (!Number.isFinite(probability)) {
      probability = 0;
    }

    item.probability =
      Math.max(0, probability);

  }


  const probabilityTotal =
    predictions.reduce(
      (sum, x) => sum + x.probability,
      0
    );


  if (probabilityTotal > 0) {

    predictions.forEach(x => {

      x.probability =
        x.probability /
        probabilityTotal;

    });

  }


  return predictions;

}


/* =========================================
   3連単表示
========================================= */

function renderTrifecta(list) {

  const minP =
    num("minProbability", 0);


  const filtered =
    list
      .filter(
        x =>
          x.probability * 100 >= minP
      )
      .sort(
        (a, b) =>
          b.probability -
          a.probability
      );


  $("trifecta").innerHTML =
    filtered.map(
      (x, index) => {

        const key =
          x.combo.join("-");

        const odds =
          fetchedOdds[key];


        const oddsValue =
          odds !== undefined &&
          odds !== null &&
          odds !== "" &&
          Number.isFinite(Number(odds))
            ? Number(odds).toFixed(1)
            : "";


        return `
          <tr>

            <td>${index + 1}</td>

            <td>${key}</td>

            <td>
              ${(x.probability * 100).toFixed(2)}%
            </td>

            <td>
              <input
                type="number"
                step="0.1"
                min="0"
                data-odds="${key}"
                value="${oddsValue}"
                placeholder="オッズ"
              >
            </td>

            <td data-expected="${key}">
              -
            </td>

            <td data-profit="${key}">
              -
            </td>

            <td data-recovery="${key}">
              -
            </td>

          </tr>
        `;

      }
    ).join("");


  attachOddsEvents();


  document
    .querySelectorAll("[data-odds]")
    .forEach(input => {

      if (input.value !== "") {

        input.dispatchEvent(
          new Event("input", {
            bubbles: true
          })
        );

      }

    });

}


/* =========================================
   オッズ計算
========================================= */

function calculateOdds(input) {

  const key =
    input.dataset.odds;

  const odds =
    Number(input.value);


  const prediction =
    currentPredictions.find(
      x =>
        x.combo.join("-") === key
    );


  if (!prediction) {
    return;
  }


  if (
    !Number.isFinite(odds) ||
    odds <= 0
  ) {

    $(`expected-${key}`)?.replaceChildren();

    const expected =
      document.querySelector(
        `[data-expected="${key}"]`
      );

    const profit =
      document.querySelector(
        `[data-profit="${key}"]`
      );

    const recovery =
      document.querySelector(
        `[data-recovery="${key}"]`
      );

    if (expected) expected.textContent = "-";
    if (profit) profit.textContent = "-";
    if (recovery) recovery.textContent = "-";

    return;

  }


  const probability =
    prediction.probability;


  const expectedPayout =
    probability *
    odds *
    100;


  const expectedProfit =
    expectedPayout -
    100;


  const recoveryRate =
    expectedPayout;


  const expected =
    document.querySelector(
      `[data-expected="${key}"]`
    );

  const profit =
    document.querySelector(
      `[data-profit="${key}"]`
    );

  const recovery =
    document.querySelector(
      `[data-recovery="${key}"]`
    );


  if (expected) {

    expected.textContent =
      `${expectedPayout.toFixed(1)}円`;

  }


  if (profit) {

    profit.textContent =
      `${expectedProfit >= 0 ? "+" : ""}${expectedProfit.toFixed(1)}円`;

    profit.className =
      expectedProfit >= 0
        ? "positive"
        : "negative";

  }


  if (recovery) {

    recovery.textContent =
      `${recoveryRate.toFixed(1)}%`;

    recovery.className =
      recoveryRate >= 100
        ? "positive"
        : "negative";

  }

}


/* =========================================
   オッズ入力イベント
========================================= */

function attachOddsEvents() {

  document
    .querySelectorAll("[data-odds]")
    .forEach(input => {

      input.addEventListener(
        "input",
        () => {

          const key =
            input.dataset.odds;

          const value =
            Number(input.value);

          if (
            Number.isFinite(value) &&
            value > 0
          ) {

            fetchedOdds[key] =
              value;

          }

          calculateOdds(input);

        }
      );

    });

}


/* =========================================
   選手表示
========================================= */

function renderBoats(boats) {

  $("boats").innerHTML =
    boats.map(
      boat => {

        return `
          <tr>

            <td>${boat.boat}</td>

            <td>${boat.name || "-"}</td>

            <td>${boat.class || "-"}</td>

            <td>${boat.nationalWinRate ?? "-"}</td>

            <td>${boat.localWinRate ?? "-"}</td>

            <td>${boat.averageST ?? "-"}</td>

            <td>${boat.motorNo ?? "-"}</td>

            <td>${boat.motor2Rate ?? "-"}</td>

            <td>${boat.boatNo ?? "-"}</td>

            <td>${boat.boat2Rate ?? "-"}</td>

            <td>${boat.exhibitionTime ?? "-"}</td>

            <td>${boat.tilt ?? "-"}</td>

            <td>${boat.startExhibition ?? "-"}</td>

          </tr>
        `;

      }
    ).join("");

}


/* =========================================
   レース情報表示
========================================= */

function renderRaceInfo(race) {

  $("raceInfo").innerHTML = `
    <strong>
      ${race.date || ""}　
      ${race.venue || ""}　
      ${race.race || ""}R
    </strong>
  `;

  $("weather").textContent =
    race.weather ?? "-";

  $("temperature").textContent =
    race.temperature !== null &&
    race.temperature !== undefined
      ? `${race.temperature}℃`
      : "-";

  $("waterTemperature").textContent =
    race.waterTemperature !== null &&
    race.waterTemperature !== undefined
      ? `${race.waterTemperature}℃`
      : "-";

  $("windDirection").textContent =
    race.windDirection ?? "-";

  $("windSpeed").textContent =
    race.windSpeed !== null &&
    race.windSpeed !== undefined
      ? `${race.windSpeed}m`
      : "-";

  $("wave").textContent =
    race.wave !== null &&
    race.wave !== undefined
      ? `${race.wave}cm`
      : "-";

}


/* =========================================
   データ取得
========================================= */

async function fetchRaceData() {

  const date =
    $("date").value;

  const venue =
    $("venue").value;

  const race =
    $("race").value;


  if (!date || !venue || !race) {

    $("status").className =
      "status error";

    $("status").textContent =
      "開催日・開催場・Rを選択してください。";

    return;

  }


  const button =
    $("fetchButton");

  button.disabled =
    true;

  button.textContent =
    "取得中...";


  $("status").className =
    "status";

  $("status").textContent =
    "BOAT RACE公式からデータを取得しています…";


  try {

    const endpoint =
      `/.netlify/functions/get-race-data` +
      `?date=${encodeURIComponent(date)}` +
      `&venue=${encodeURIComponent(venue)}` +
      `&race=${encodeURIComponent(race)}`;


    const response =
      await fetch(endpoint, {
        cache: "no-store"
      });


    const rawText =
      await response.text();


    let data;


    try {

      data =
        JSON.parse(rawText);

    } catch (parseError) {

      throw new Error(
        "サーバーからJSONではないデータが返りました。\n" +
        rawText.slice(0, 500)
      );

    }


    if (!response.ok) {

      throw new Error(
        data.error ||
        `データ取得失敗 HTTP ${response.status}`
      );

    }


    if (!data.success) {

      throw new Error(
        data.error ||
        "データ取得に失敗しました"
      );

    }


    if (!data.race) {

      throw new Error(
        "レースデータがありません"
      );

    }


    currentRace =
      data.race;


    /* =========================
       オッズを受け取る
    ========================= */

    fetchedOdds = {};


    const serverOdds =
      data.race.odds &&
      data.race.odds.trifecta;


    if (
      serverOdds &&
      typeof serverOdds === "object"
    ) {

      Object.keys(serverOdds)
        .forEach(key => {

          const value =
            Number(serverOdds[key]);

          if (
            Number.isFinite(value) &&
            value > 0
          ) {

            fetchedOdds[key] =
              value;

          }

        });

    }


    /* =========================
       表示
    ========================= */

    renderRaceInfo(
      data.race
    );


    renderBoats(
      data.race.boats || []
    );


    currentPredictions =
      calculatePredictions(
        data.race.boats || []
      );


    renderTrifecta(
      currentPredictions
    );


    const oddsCount =
      Object.keys(fetchedOdds).length;


    $("status").className =
      "status success";

    $("status").textContent =
      `データ取得完了\n` +
      `選手：${(data.race.boats || []).length}艇\n` +
      `3連単オッズ：${oddsCount}件`;


  } catch (error) {

    console.error(error);


    $("status").className =
      "status error";

    $("status").textContent =
      `取得エラー：${error.message}`;


  } finally {

    button.disabled =
      false;

    button.textContent =
      "データ取得・予想開始";

  }

}


/* =========================================
   ボタン
========================================= */

$("fetchButton")
  .addEventListener(
    "click",
    fetchRaceData
  );


/* =========================================
   最低確率変更
========================================= */

$("minProbability")
  .addEventListener(
    "input",
    () => {

      if (
        currentPredictions.length
      ) {

        renderTrifecta(
          currentPredictions
        );

      }

    }
  );

</script>

</body>
</html>
